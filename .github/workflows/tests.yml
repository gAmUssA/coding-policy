name: Tests

# Gates on every PR (and on direct pushes to main):
#   1. diagnostics  — shellcheck over every first-party shell script and
#      pyright over first-party Python, at zero findings
#      (rules/language-diagnostics.md). Runs first: static checks are fast
#      and cheap (rules/code-formatting.md CI Integration). Two repo checks
#      run ahead of the engines in the same job: the rules/ byte budget
#      (scripts/check-rules-budget.sh) and leftover merge-conflict markers
#      in tracked files (scripts/check-conflict-markers.sh).
#   2. lint         — `tessl plugin lint` (manifest + skill-frontmatter +
#      structure validation), so a bad manifest is caught here, not when it
#      breaks publish.yml after merge.
#   3. unit-tests   — every module's shell and Python suite via scripts/run-tests.sh
#      (rules/testing-standards.md). Gated on diagnostics + lint passing.
#   4. changelog-fragment — PR only: a change to shipped content carries a
#      changelog.d/ fragment, and the PR edits no manifest version and adds no
#      CHANGELOG version heading; publish.yml assigns the version on merge.
# publish.yml reruns lint + diagnostics + the suites before release as
# defense-in-depth.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rules stay within their byte budget
        run: bash scripts/check-rules-budget.sh
      - name: No leftover merge-conflict markers
        run: bash scripts/check-conflict-markers.sh
      - uses: ./.github/actions/setup-diagnostics
      - name: Run language-diagnostics gate
        run: bash scripts/run-diagnostics.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: tesslio/setup-tessl@v2
        with:
          token: ${{ secrets.TESSL_TOKEN }}
      - name: Lint plugin
        run: tessl plugin lint

  unit-tests:
    needs: [diagnostics, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Python suites run through uv (scripts/run-tests.sh).
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: "0.13.1"
      - name: Run unit test suites
        run: uv run --no-project --no-python-downloads --python '>=3.11' bash scripts/run-tests.sh

  changelog-fragment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Full history: the gate diffs the PR head from its merge base with the
      # base branch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Shipped changes carry a fragment and assign no version
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-changelog-fragment.sh "origin/${BASE_REF}" "$HEAD_SHA"
